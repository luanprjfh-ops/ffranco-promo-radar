<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FFranco • Promo Radar</title>

  <style>
    :root{
      --black:#000000;
      --grey11:#1C1C1C;
      --darkgray:#A9A9A9;
      --line: rgba(169,169,169,.22);
      --text:#EDEDED;
      --muted: rgba(237,237,237,.72);
      --card: rgba(0,0,0,.38);
      --r: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--text);
      font-family:system-ui,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(169,169,169,.12), transparent 55%),
        radial-gradient(700px 420px at 90% 10%, rgba(169,169,169,.08), transparent 60%),
        linear-gradient(180deg, var(--black), var(--grey11));
      min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:20;
      background: rgba(0,0,0,.70);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .wrap{max-width:1200px;margin:0 auto;padding:14px 16px}
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .brand h1{margin:0;font-size:18px;letter-spacing:.6px}
    .brand small{color:var(--muted)}
    .search{
      display:flex; align-items:center; gap:10px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:10px 12px;
      background: rgba(255,255,255,.04);
      min-width:min(520px,100%);
    }
    .search input{
      border:0; outline:0; background:transparent;
      color:var(--text);
      width:100%;
      font-size:14px;
    }
    .grid{
      max-width:1200px;margin:0 auto;
      padding:18px 16px;
      display:grid; gap:14px;
      grid-template-columns:repeat(12,1fr);
    }
    .card{
      grid-column:span 4;
      border:1px solid var(--line);
      border-radius:var(--r);
      overflow:hidden;
      background: var(--card);
    }
    .img{
      height:190px;
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .img img{width:100%;height:100%;object-fit:cover}
    .body{padding:12px}
    .title{margin:0 0 6px;font-size:16px;line-height:1.25}
    .meta{color:var(--muted);font-size:13px}
    .price{font-size:20px;margin:8px 0}
    .old{color:rgba(237,237,237,.55);text-decoration:line-through;font-size:13px;margin-left:8px}
    .desc{color:rgba(237,237,237,.78);font-size:13.5px;line-height:1.45;margin:6px 0 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    a.btn{
      flex:1;text-align:center;text-decoration:none;color:var(--text);
      padding:10px 12px;border-radius:14px;
      border:1px solid var(--line);
      background: rgba(169,169,169,.12);
    }
    a.wa{border-color: rgba(32,255,154,.28); background: rgba(32,255,154,.10)}
    .empty{max-width:1200px;margin:0 auto;padding:16px;color:var(--muted)}
    @media (max-width:980px){.card{grid-column:span 6}}
    @media (max-width:640px){.card{grid-column:span 12}.search{min-width:100%}}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>FFranco</h1>
        <small>Promo Radar • as melhores promoções do dia</small>
      </div>
      <div class="search">
        <input id="q" placeholder="Pesquisar por nome, loja, tag..." autocomplete="off" />
      </div>
    </div>
  </div>
</header>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">Sem promoções por enquanto.</div>

<script>
  // ====== SUPABASE (já preenchido) ======
  const SUPABASE_URL = "https://dtovqtfwkjkxzyrxoegz.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JyIW3Qc0_wRxwdehMI9ISQ_XjR9Ux9E";

  // ✅ Use um nome diferente de "supabase" para não conflitar com o global do CDN
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // ====== WHATSAPP (troque para o seu número com DDI+DDD) ======
  const WHATSAPP_NUMBER = "5592999999999";

  const moneyBR = (n) => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const waLink = (p) => {
    const msg = encodeURIComponent(`Olá! Quero essa promoção: ${p.name} por ${moneyBR(p.price)}. Link: ${p.buy_link}`);
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
  };

  let ALL = [];

  function escapeHTML(str){
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[m]));
  }

  function cardHTML(p){
    const meta = [p.store, p.tag ? ("#" + p.tag) : null].filter(Boolean).join(" • ");
    return `
      <div class="card">
        <div class="img">
          ${p.img_url ? `<img src="${p.img_url}" alt="">`
            : `<span style="color:rgba(237,237,237,.6);font-size:13px">Sem imagem</span>`}
        </div>
        <div class="body">
          <h3 class="title">${escapeHTML(p.name)}</h3>
          <div class="meta">${escapeHTML(meta)}</div>
          <div class="price">
            ${moneyBR(p.price)}
            ${p.old_price ? `<span class="old">${moneyBR(p.old_price)}</span>` : ""}
          </div>
          ${p.coupon ? `<div class="meta">Cupom: <b>${escapeHTML(p.coupon)}</b></div>` : ""}
          ${p.description ? `<p class="desc">${escapeHTML(p.description)}</p>` : ""}
          <div class="row">
            <a class="btn" href="${p.buy_link}" target="_blank" rel="noopener">Comprar</a>
            <a class="btn wa" href="${waLink(p)}" target="_blank" rel="noopener">WhatsApp</a>
          </div>
        </div>
      </div>
    `;
  }

  function render(list){
    const grid = document.querySelector("#grid");
    const empty = document.querySelector("#empty");
    grid.innerHTML = list.map(cardHTML).join("");
    empty.style.display = list.length ? "none" : "block";
  }

  function applySearch(){
    const q = (document.querySelector("#q").value || "").toLowerCase().trim();
    if(!q) return render(ALL);
    const f = ALL.filter(p => {
      const blob = `${p.name} ${p.store || ""} ${p.tag || ""} ${p.coupon || ""}`.toLowerCase();
      return blob.includes(q);
    });
    render(f);
  }

  async function loadPromos(){
    const { data, error } = await sb
      .from("promos")
      .select("*")
      .order("created_at", { ascending: false });

    if(error){
      console.error(error);
      render([]);
      return;
    }
    ALL = data || [];
    applySearch();
  }

  document.querySelector("#q").addEventListener("input", applySearch);

  loadPromos();
  setInterval(loadPromos, 15000);
</script>
</body>
</html>
